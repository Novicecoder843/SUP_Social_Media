<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CHAT PRO</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      overflow:hidden;
      background:#fafafa;
    }

    .sidebar{
      width:350px;
      background:white;
      border-right:1px solid #ddd;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      height:70px;
      padding:20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid #ddd;
      font-size:20px;
      font-weight:bold;
    }

    .search{
      padding:15px;
      border-bottom:1px solid #eee;
    }

    .search input{
      width:100%;
      padding:12px;
      border:none;
      outline:none;
      background:#efefef;
      border-radius:10px;
    }

    .chat-list{
      flex:1;
      overflow-y:auto;
    }

    .user{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px;
      cursor:pointer;
      border-bottom:1px solid #f5f5f5;
      transition:0.2s;
    }

    .user:hover{
      background:#fafafa;
    }

    .active{
      background:#f0f0f0;
    }

    .avatar{
      width:56px;
      height:56px;
      border-radius:50%;
      background:linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
      );

      padding:2px;

      display:flex;
      align-items:center;
      justify-content:center;

      flex-shrink:0;
    }

    .avatar-inner{
      width:100%;
      height:100%;
      border-radius:50%;
      background:white;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:20px;
      font-weight:bold;
    }

    .user-info{
      flex:1;
    }

    .username{
      font-size:14px;
      font-weight:bold;
    }

    .last-message{
      margin-top:3px;
      font-size:13px;
      color:gray;
    }

    .online-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#00c853;
    }

    .chat-container{
      flex:1;
      display:flex;
      flex-direction:column;
      background:white;
    }

    .chat-header{
      height:70px;
      padding:0 20px;
      display:flex;
      align-items:center;
      gap:12px;
      border-bottom:1px solid #ddd;
      background:white;
    }

    .chat-user{
      font-size:15px;
      font-weight:bold;
    }

    .typing{
      font-size:12px;
      color:gray;
    }

    #chatBox{
      flex:1;
      overflow-y:auto;
      padding:20px;
      display:flex;
      flex-direction:column;
      background:#fafafa;
    }

    .empty{
      margin:auto;
      color:gray;
      font-size:15px;
      text-align:center;
    }

    .loading{
      text-align:center;
      padding:20px;
      color:gray;
      font-size:13px;
    }

    .message{
      max-width:65%;
      padding:12px 15px;
      margin:5px 0;
      border-radius:22px;
      font-size:14px;
      line-height:1.4;
      word-wrap:break-word;
      position:relative;
    }

    .me{
      align-self:flex-end;
      background:#3797f0;
      color:white;
      border-bottom-right-radius:8px;
    }

    .friend{
      align-self:flex-start;
      background:#efefef;
      color:black;
      border-bottom-left-radius:8px;
    }

    .time{
      margin-top:5px;
      font-size:10px;
      opacity:0.7;
      text-align:right;
    }

    .delete-btn{
      margin-left:8px;
      cursor:pointer;
      color:red;
      font-size:12px;
    }

    .chat-input{
      padding:15px;
      border-top:1px solid #ddd;
      background:white;
    }

    .input-box{
      display:flex;
      align-items:center;
      border:1px solid #ddd;
      border-radius:30px;
      padding:10px 15px;
    }

    .input-box input{
      flex:1;
      border:none;
      outline:none;
      font-size:14px;
      background:transparent;
    }

    .send-btn{
      border:none;
      background:none;
      color:#3797f0;
      font-size:14px;
      font-weight:bold;
      cursor:pointer;
    }

    @media(max-width:768px){

      .sidebar{
        width:80px;
      }

      .username,
      .last-message{
        display:none;
      }

      .chat-user{
        font-size:13px;
      }
    }

  </style>
</head>

<body>

  <div class="sidebar">

    <div class="topbar">
      CHAT PRO
    </div>

    <div class="search">

      <input
        type="text"
        placeholder="Search"
        oninput="searchUser(this.value)"
      />

    </div>

    <div
      id="chatList"
      class="chat-list"
    ></div>

  </div>

  <div class="chat-container">

    <div class="chat-header">

      <div class="avatar">
        <div
          class="avatar-inner"
          id="headerAvatar"
        >
          U
        </div>
      </div>

      <div>

        <div
          class="chat-user"
          id="chatHeader"
        >
          Select a user
        </div>

        <div
          class="typing"
          id="typing"
        ></div>

      </div>

    </div>

    <div id="chatBox">

      <div class="empty">
        <h2>CHAT PRO</h2>
        <br>
        Select user or group to start chatting 🚀
      </div>

    </div>

    <div class="chat-input">

      <div class="input-box">

        <input
          id="message"
          placeholder="Message..."
          onkeypress="handleEnter(event)"
          oninput="typingEvent()"
        />

        <button
          class="send-btn"
          onclick="send()"
        >
          Send
        </button>

      </div>

    </div>

  </div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>

let socket;
let myUserId;

let currentChatUser = null;
let currentGroupId = null;

let usersCache = [];
let groupsCache = [];

let onlineUsers = [];

/////////////////////////////////////////////////////
// CONNECT
/////////////////////////////////////////////////////

function connect(token){

  const decoded =
    JSON.parse(
      atob(token.split('.')[1])
    );

  myUserId = decoded.id;

  socket = io(
    "http://localhost:3001",
    {
      auth:{ token }
    }
  );

  socket.on(
    "connect",
    ()=>{

      console.log(
        "🟢 Connected"
      );

      document.getElementById(
        "typing"
      ).innerText =
        "🟢 Connected";

      setTimeout(()=>{

        document.getElementById(
          "typing"
        ).innerText = "";

      },2000);

      loadChatList();
      loadGroups();
    }
  );

  socket.on(
    "disconnect",
    ()=>{

      document.getElementById(
        "typing"
      ).innerText =
        "❌ Socket disconnected";

      console.log(
        "❌ Socket disconnected"
      );
    }
  );

  socket.on(
    "onlineUsers",
    users => {

      onlineUsers = users;

      loadChatList();
    }
  );

  socket.on(
    "receive_message",
    msg => {

      if(
        Number(msg.sender_id) ===
        Number(myUserId)
      ){
        return;
      }

      if(
        msg.sender_id ==
        currentChatUser ||

        msg.receiver_id ==
        currentChatUser
      ){
        renderMessage(msg);
      }

      socket.emit(
        "seen",
        {
          sender_id:
            msg.sender_id
        }
      );

      loadChatList();
    }
  );

  socket.on(
    "message_sent",
    msg => {

      renderMessage(msg);

      loadChatList();
    }
  );

  socket.on(
    "receive_group_message",
    msg => {

      console.log(
        "👥 GROUP MESSAGE:",
        msg
      );

      if(
        Number(msg.group_id) ===
        Number(currentGroupId)
      ){
        renderMessage(msg);
      }
    }
  );

  socket.on(
    "typing",
    ()=>{

      document.getElementById(
        "typing"
      ).innerText =
        "Typing...";
    }
  );

  socket.on(
    "stop_typing",
    ()=>{

      document.getElementById(
        "typing"
      ).innerText = "";
    }
  );
}

/////////////////////////////////////////////////////
// LOAD CHAT LIST
/////////////////////////////////////////////////////

async function loadChatList(){

  const res = await fetch(
    "http://localhost:3001/api/chats/list",
    {
      headers:{
        Authorization:
          "Bearer " +
          localStorage.getItem(
            "token"
          )
      }
    }
  );

  const data =
    await res.json();

  usersCache =
    data.users || [];

  const list =
    document.getElementById(
      "chatList"
    );

  list.innerHTML = "";

  usersCache.forEach(u => {

    const online =
      onlineUsers.includes(
        String(u.user_id)
      );

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "user " +
      (
        currentChatUser ==
        u.user_id
        ? "active"
        : ""
      );

    div.onclick =
      ()=> openChat(u);

    div.innerHTML = `
      <div class="avatar">
        <div class="avatar-inner">
          ${u.email[0].toUpperCase()}
        </div>
      </div>

      <div class="user-info">

        <div class="username">
          ${u.email}
        </div>

        <div class="last-message">
          ${
            u.last_message ||
            "Active now"
          }
        </div>

      </div>

      ${
        online
        ? `<div class="online-dot"></div>`
        : ""
      }
    `;

    list.appendChild(div);
  });

  const title =
    document.createElement("div");

  title.style.padding = "12px";
  title.style.fontWeight = "bold";
  title.innerText = "👥 Groups";

  list.appendChild(title);

  groupsCache.forEach(group => {

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "user " +
      (
        currentGroupId ==
        group.id
        ? "active"
        : ""
      );

    div.onclick =
      ()=> openGroup(group);

    div.innerHTML = `
      <div class="avatar">
        <div class="avatar-inner">
          👥
        </div>
      </div>

      <div class="user-info">

        <div class="username">
          ${group.name}
        </div>

        <div class="last-message">
          Group Chat
        </div>

      </div>
    `;

    list.appendChild(div);
  });
}

/////////////////////////////////////////////////////
// LOAD GROUPS
/////////////////////////////////////////////////////

async function loadGroups(){

  try {

    const res = await fetch(
      "http://localhost:3001/api/chats/groups",
      {
        headers:{
          Authorization:
            "Bearer " +
            localStorage.getItem(
              "token"
            )
        }
      }
    );

    const data =
      await res.json();

    groupsCache =
      data.groups || [];

    loadChatList();

  } catch(err){

    console.log(
      "❌ GROUP LOAD ERROR:",
      err.message
    );
  }
}

/////////////////////////////////////////////////////
// OPEN PRIVATE CHAT
/////////////////////////////////////////////////////

async function openChat(user){

  currentGroupId = null;

  currentChatUser =
    user.user_id;

  document.getElementById(
    "chatHeader"
  ).innerText =
    user.email;

  document.getElementById(
    "headerAvatar"
  ).innerText =
    user.email[0]
      .toUpperCase();

  const chatBox =
    document.getElementById(
      "chatBox"
    );

  chatBox.innerHTML = `
    <div class="loading">
      Loading messages...
    </div>
  `;

  const res = await fetch(
    `http://localhost:3001/api/chats/conversation/${user.user_id}`,
    {
      headers:{
        Authorization:
          "Bearer " +
          localStorage.getItem(
            "token"
          )
      }
    }
  );

  const data =
    await res.json();

  chatBox.innerHTML = "";

  (
    data.messages || []
  ).forEach(
    renderMessage
  );
}

/////////////////////////////////////////////////////
// OPEN GROUP
/////////////////////////////////////////////////////

async function openGroup(group){

  currentChatUser = null;

  currentGroupId =
    group.id;

  socket.emit(
    "join_group",
    group.id
  );

  document.getElementById(
    "chatHeader"
  ).innerText =
    group.name;

  document.getElementById(
    "headerAvatar"
  ).innerText = "👥";

  const chatBox =
    document.getElementById(
      "chatBox"
    );

  chatBox.innerHTML = `
    <div class="loading">
      Loading group messages...
    </div>
  `;

  try {

    const res = await fetch(
      `http://localhost:3001/api/chats/groups/${group.id}/messages`,
      {
        headers:{
          Authorization:
            "Bearer " +
            localStorage.getItem(
              "token"
            )
        }
      }
    );

    const data =
      await res.json();

    chatBox.innerHTML = "";

    const messages =
      data.messages ||
      data.data ||
      [];

    messages.forEach(
      renderMessage
    );

  } catch(err){

    console.log(
      "❌ GROUP ERROR:",
      err.message
    );
  }
}

/////////////////////////////////////////////////////
// DELETE MESSAGE
/////////////////////////////////////////////////////

async function deleteMessage(messageId){

  const confirmDelete =
    confirm(
      "Delete this message?"
    );

  if(!confirmDelete) return;

  try{

    const res = await fetch(
      `http://localhost:3001/api/chats/${messageId}`,
      {
        method:"DELETE",

        headers:{
          Authorization:
            "Bearer " +
            localStorage.getItem(
              "token"
            )
        }
      }
    );

    const data =
      await res.json();

    if(data.success){

      const msgEl =
        document.getElementById(
          "msg_" + messageId
        );

      if(msgEl){
        msgEl.remove();
      }

      console.log(
        "✅ Message deleted"
      );

    }else{

      alert(
        data.message ||
        "Delete failed"
      );
    }

  }catch(err){

    console.log(
      "❌ DELETE ERROR:",
      err.message
    );

    alert(
      "Delete failed"
    );
  }
}

/////////////////////////////////////////////////////
// RENDER MESSAGE
/////////////////////////////////////////////////////

function renderMessage(msg){

  const chatBox =
    document.getElementById(
      "chatBox"
    );

  const empty =
    document.querySelector(
      ".empty"
    );

  if(empty){
    empty.remove();
  }

  const div =
    document.createElement(
      "div"
    );

  div.id =
    "msg_" + msg.id;

  div.className =
    "message " +
    (
      Number(msg.sender_id) ===
      Number(myUserId)
      ? "me"
      : "friend"
    );

  const time =
    new Date(
      msg.created_at ||
      Date.now()
    ).toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  const deleteBtn =
    Number(msg.sender_id) ===
    Number(myUserId)

    ? `
      <span
        class="delete-btn"
        onclick="deleteMessage(${msg.id})"
      >
        🗑️
      </span>
    `
    : "";

  div.innerHTML = `
    <div>

      ${
        currentGroupId &&
        msg.sender_name
        ? `
          <div style="
            font-size:12px;
            font-weight:bold;
            margin-bottom:5px;
          ">
            ${msg.sender_name}
          </div>
        `
        : ""
      }

      ${msg.message}

    </div>

    <div class="time">

      ${time}

      ${
        Number(msg.sender_id) ===
        Number(myUserId)
        ? " ✔✔"
        : ""
      }

      ${deleteBtn}

    </div>
  `;

  chatBox.appendChild(div);

  chatBox.scrollTo({
    top:chatBox.scrollHeight,
    behavior:"smooth"
  });
}

/////////////////////////////////////////////////////
// SEND MESSAGE
/////////////////////////////////////////////////////

function send(){

  const input =
    document.getElementById(
      "message"
    );

  const message =
    input.value.trim();

  if(!message) return;

  if(currentGroupId){

    socket.emit(
      "send_group_message",
      {
        group_id:
          currentGroupId,

        message
      }
    );

    input.value = "";

    return;
  }

  if(!currentChatUser){

    alert(
      "Select user/group first"
    );

    return;
  }

  socket.emit(
    "send_message",
    {
      sender_id:
        myUserId,

      receiver_id:
        currentChatUser,

      message
    }
  );

  input.value = "";
}

/////////////////////////////////////////////////////
// ENTER KEY
/////////////////////////////////////////////////////

function handleEnter(e){

  if(e.key === "Enter"){
    send();
  }
}

/////////////////////////////////////////////////////
// TYPING
/////////////////////////////////////////////////////

function typingEvent(){

  if(
    !currentChatUser
  ) return;

  socket.emit(
    "typing",
    {
      sender_id:
        myUserId,

      receiver_id:
        currentChatUser
    }
  );

  clearTimeout(
    window.typingTimeout
  );

  window.typingTimeout =
    setTimeout(()=>{

      socket.emit(
        "stop_typing",
        {
          receiver_id:
            currentChatUser
        }
      );

    },1000);
}

/////////////////////////////////////////////////////
// SEARCH
/////////////////////////////////////////////////////

function searchUser(text){

  const filtered =
    usersCache.filter(u =>
      u.email
        .toLowerCase()
        .includes(
          text.toLowerCase()
        )
    );

  const list =
    document.getElementById(
      "chatList"
    );

  list.innerHTML = "";

  filtered.forEach(u => {

    const div =
      document.createElement(
        "div"
      );

    div.className = "user";

    div.onclick =
      ()=> openChat(u);

    div.innerHTML = `
      <div class="avatar">
        <div class="avatar-inner">
          ${u.email[0].toUpperCase()}
        </div>
      </div>

      <div class="user-info">

        <div class="username">
          ${u.email}
        </div>

      </div>
    `;

    list.appendChild(div);
  });
}

/////////////////////////////////////////////////////
// NETWORK STATUS
/////////////////////////////////////////////////////

window.addEventListener(
  "offline",
  () => {

    document.getElementById(
      "typing"
    ).innerText =
      "❌ Offline";

    console.log(
      "❌ Internet disconnected"
    );
  }
);

window.addEventListener(
  "online",
  () => {

    document.getElementById(
      "typing"
    ).innerText =
      "🟢 Online";

    console.log(
      "🟢 Internet connected"
    );

    setTimeout(()=>{

      document.getElementById(
        "typing"
      ).innerText = "";

    },2000);
  }
);

/////////////////////////////////////////////////////
// INIT
/////////////////////////////////////////////////////

let token =
  localStorage.getItem(
    "token"
  );

if(!token){

  token = prompt(
    "Paste JWT Token"
  );

  localStorage.setItem(
    "token",
    token
  );
}

connect(token);

</script>

</body>
</html>
