<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>CHAT PRO</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      background:#fafafa;
      display:flex;
      overflow:hidden;
    }

   
    .sidebar{
      width:350px;
      border-right:1px solid #ddd;
      background:white;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      height:70px;
      padding:20px;
      border-bottom:1px solid #ddd;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-weight:bold;
      font-size:20px;
    }

    .search{
      padding:15px;
      border-bottom:1px solid #eee;
    }

    .search input{
      width:100%;
      padding:12px;
      border:none;
      background:#efefef;
      border-radius:10px;
      outline:none;
    }

    .chat-list{
      flex:1;
      overflow-y:auto;
    }

    .user{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px;
      cursor:pointer;
      transition:0.2s;
      border-bottom:1px solid #f5f5f5;
    }

    .user:hover{
      background:#fafafa;
    }

    .active{
      background:#f0f0f0;
    }

    .avatar{
      width:56px;
      height:56px;
      border-radius:50%;
      background:linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
      );

      padding:2px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .avatar-inner{
      width:100%;
      height:100%;
      border-radius:50%;
      background:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      font-size:20px;
    }

    .user-info{
      flex:1;
    }

    .username{
      font-weight:bold;
      font-size:14px;
    }

    .last-message{
      color:gray;
      font-size:13px;
      margin-top:3px;
    }

    .online-dot{
      width:10px;
      height:10px;
      background:#00c853;
      border-radius:50%;
      margin-left:auto;
    }

    
    .chat-container{
      flex:1;
      display:flex;
      flex-direction:column;
      background:white;
    }

    .chat-header{
      height:70px;
      border-bottom:1px solid #ddd;
      padding:0 20px;
      display:flex;
      align-items:center;
      gap:12px;
      background:white;
    }

    .chat-user{
      font-weight:bold;
      font-size:15px;
    }

    .typing{
      font-size:12px;
      color:gray;
    }

    
    #chatBox{
      flex:1;
      overflow-y:auto;
      padding:20px;
      background:#fafafa;
      display:flex;
      flex-direction:column;
    }

    .empty{
      margin:auto;
      color:gray;
      font-size:15px;
    }

    
    .message{
      max-width:65%;
      padding:12px 15px;
      margin:5px 0;
      border-radius:22px;
      font-size:14px;
      line-height:1.4;
      word-wrap:break-word;
      position:relative;
    }

    .me{
      align-self:flex-end;
      background:#3797f0;
      color:white;
      border-bottom-right-radius:8px;
    }

    .friend{
      align-self:flex-start;
      background:#efefef;
      color:black;
      border-bottom-left-radius:8px;
    }

    .time{
      font-size:10px;
      margin-top:5px;
      opacity:0.7;
      text-align:right;
    }

    
    .chat-input{
      padding:15px;
      border-top:1px solid #ddd;
      background:white;
    }

    .input-box{
      display:flex;
      align-items:center;
      border:1px solid #ddd;
      border-radius:30px;
      padding:10px 15px;
      background:white;
    }

    .input-box input{
      flex:1;
      border:none;
      outline:none;
      font-size:14px;
      background:transparent;
    }

    .send-btn{
      background:none;
      border:none;
      color:#3797f0;
      font-weight:bold;
      cursor:pointer;
      font-size:14px;
    }

   
    @media(max-width:768px){

      .sidebar{
        width:100px;
      }

      .username,
      .last-message{
        display:none;
      }

      .chat-header .chat-user{
        font-size:13px;
      }
    }

  </style>
</head>

<body>

  
  <div class="sidebar">

    <div class="topbar">
      Instagram
    </div>

    <div class="search">
      <input
        type="text"
        placeholder="Search"
        oninput="searchUser(this.value)"
      />
    </div>

    <div id="chatList" class="chat-list"></div>

  </div>

  
  <div class="chat-container">

    <div class="chat-header">

      <div class="avatar">
        <div class="avatar-inner" id="headerAvatar">
          U
        </div>
      </div>

      <div>
        <div class="chat-user" id="chatHeader">
          Select a user
        </div>

        <div class="typing" id="typing"></div>
      </div>

    </div>

    <div id="chatBox">

      <div class="empty">
        Send private messages 🚀
      </div>

    </div>

    
    <div class="chat-input">

      <div class="input-box">

        <input
          id="message"
          placeholder="Message..."
          onkeypress="handleEnter(event)"
          oninput="typingEvent()"
        />

        <button
          class="send-btn"
          onclick="send()"
        >
          Send
        </button>

      </div>

    </div>

  </div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>

let socket;
let myUserId;

let currentChatUser = null;
let currentGroupId = null;

let usersCache = [];
let groupsCache = [];

let onlineUsers = [];

/////////////////////////////////////////////////////
// CONNECT
/////////////////////////////////////////////////////
function connect(token){

  const decoded = JSON.parse(
    atob(token.split('.')[1])
  );

  myUserId = decoded.id;

  socket = io(
    "http://localhost:3001",
    {
      auth:{ token }
    }
  );

  /////////////////////////////////////////////////////
  // CONNECTED
  /////////////////////////////////////////////////////
  socket.on("connect", ()=>{

    console.log("🟢 Connected");

    loadChatList();

    loadGroups();
  });

  /////////////////////////////////////////////////////
  // ONLINE USERS
  /////////////////////////////////////////////////////
  socket.on(
    "onlineUsers",
    users => {

      onlineUsers = users;

      loadChatList();
    }
  );

  /////////////////////////////////////////////////////
  // RECEIVE PRIVATE MESSAGE
  /////////////////////////////////////////////////////
  socket.on(
    "receive_message",
    msg => {

      if(
        msg.sender_id == currentChatUser ||
        msg.receiver_id == currentChatUser
      ){
        renderMessage(msg);
      }

      loadChatList();
    }
  );

  /////////////////////////////////////////////////////
  // MESSAGE SENT
  /////////////////////////////////////////////////////
  socket.on(
    "message_sent",
    msg => {

      renderMessage(msg);

      loadChatList();
    }
  );

  /////////////////////////////////////////////////////
  // RECEIVE GROUP MESSAGE
  /////////////////////////////////////////////////////
  socket.on(
    "receive_group_message",
    msg => {

      if(
        msg.group_id ==
        currentGroupId
      ){
        renderMessage(msg);
      }
    }
  );

  /////////////////////////////////////////////////////
  // TYPING
  /////////////////////////////////////////////////////
  socket.on("typing", ()=>{

    document.getElementById(
      "typing"
    ).innerText = "Typing...";
  });

  /////////////////////////////////////////////////////
  // STOP TYPING
  /////////////////////////////////////////////////////
  socket.on(
    "stop_typing",
    ()=>{

      document.getElementById(
        "typing"
      ).innerText = "";
    }
  );
}

/////////////////////////////////////////////////////
// LOAD CHAT LIST
/////////////////////////////////////////////////////
async function loadChatList(){

  const res = await fetch(
    "http://localhost:3001/api/chats/list",
    {
      headers:{
        Authorization:
          "Bearer " +
          localStorage.getItem(
            "token"
          )
      }
    }
  );

  const data =
    await res.json();

  usersCache =
    data.users || [];

  const list =
    document.getElementById(
      "chatList"
    );

  list.innerHTML = "";

  /////////////////////////////////////////////////////
  // USERS
  /////////////////////////////////////////////////////
  usersCache.forEach(u => {

    const online =
      onlineUsers.includes(
        String(u.user_id)
      );

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "user " +
      (
        currentChatUser ==
        u.user_id
        ? "active"
        : ""
      );

    div.onclick =
      ()=> openChat(u);

    div.innerHTML = `
      <div class="avatar">
        <div class="avatar-inner">
          ${u.email[0]
            .toUpperCase()}
        </div>
      </div>

      <div class="user-info">

        <div class="username">
          ${u.email}
        </div>

        <div class="last-message">
          ${
            u.last_message ||
            "Active now"
          }
        </div>

      </div>

      ${
        online
        ? `<div class="online-dot"></div>`
        : ""
      }
    `;

    list.appendChild(div);
  });

  /////////////////////////////////////////////////////
  // GROUP TITLE
  /////////////////////////////////////////////////////
  const title =
    document.createElement("div");

  title.style.padding = "12px";
  title.style.fontWeight = "bold";
  title.innerText = "👥 Groups";

  list.appendChild(title);

  /////////////////////////////////////////////////////
  // GROUPS
  /////////////////////////////////////////////////////
  groupsCache.forEach(group => {

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "user " +
      (
        currentGroupId ==
        group.id
        ? "active"
        : ""
      );

    div.onclick =
      ()=> openGroup(group);

    div.innerHTML = `
      <div class="avatar">
        <div class="avatar-inner">
          👥
        </div>
      </div>

      <div class="user-info">

        <div class="username">
          ${group.name}
        </div>

        <div class="last-message">
          Group Chat
        </div>

      </div>
    `;

    list.appendChild(div);
  });
}

/////////////////////////////////////////////////////
// LOAD GROUPS
/////////////////////////////////////////////////////
async function loadGroups(){

  try {

    const res = await fetch(
      "http://localhost:3001/api/chats/groups",
      {
        headers:{
          Authorization:
            "Bearer " +
            localStorage.getItem(
              "token"
            )
        }
      }
    );

    const data =
      await res.json();

    groupsCache =
      data.groups || [];

    loadChatList();

  } catch(err){

    console.log(
      "❌ GROUP LOAD ERROR:",
      err.message
    );
  }
}

/////////////////////////////////////////////////////
// OPEN PRIVATE CHAT
/////////////////////////////////////////////////////
async function openChat(user){

  currentGroupId = null;

  currentChatUser =
    user.user_id;

  document.getElementById(
    "chatHeader"
  ).innerText =
    user.email;

  document.getElementById(
    "headerAvatar"
  ).innerText =
    user.email[0]
      .toUpperCase();

  const chatBox =
    document.getElementById(
      "chatBox"
    );

  chatBox.innerHTML = "";

  const res = await fetch(
    `http://localhost:3001/api/chats/conversation/${user.user_id}`,
    {
      headers:{
        Authorization:
          "Bearer " +
          localStorage.getItem(
            "token"
          )
      }
    }
  );

  const data =
    await res.json();

  (
    data.messages || []
  ).forEach(
    renderMessage
  );

  socket.emit(
    "seen",
    {
      sender_id:
        user.user_id,
      receiver_id:
        myUserId
    }
  );
}

/////////////////////////////////////////////////////
// OPEN GROUP
/////////////////////////////////////////////////////
async function openGroup(group){

  currentChatUser = null;

  currentGroupId =
    group.id;

  /////////////////////////////////////////////////////
  // JOIN ROOM
  /////////////////////////////////////////////////////
  socket.emit(
    "join_group",
    group.id
  );

  document.getElementById(
    "chatHeader"
  ).innerText =
    group.name;

  document.getElementById(
    "headerAvatar"
  ).innerText = "👥";

  const chatBox =
    document.getElementById(
      "chatBox"
    );

  chatBox.innerHTML = "";

  /////////////////////////////////////////////////////
  // LOAD GROUP MESSAGES
  /////////////////////////////////////////////////////
  const res = await fetch(
    `http://localhost:3001/api/chats/groups/${group.id}/messages`,
    {
      headers:{
        Authorization:
          "Bearer " +
          localStorage.getItem(
            "token"
          )
      }
    }
  );

  const data =
    await res.json();

  (
    data.messages || []
  ).forEach(
    renderMessage
  );
}

/////////////////////////////////////////////////////
// RENDER MESSAGE
/////////////////////////////////////////////////////
function renderMessage(msg){

  const chatBox =
    document.getElementById(
      "chatBox"
    );

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message " +
    (
      msg.sender_id ==
      myUserId
      ? "me"
      : "friend"
    );

  const time =
    new Date()
      .toLocaleTimeString(
        [],
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

  div.innerHTML = `
    <div>
      ${
        msg.sender_name
        ? `<b>${msg.sender_name}</b><br>`
        : ""
      }

      ${msg.message}
    </div>

    <div class="time">
      ${time}
    </div>
  `;

  chatBox.appendChild(div);

  chatBox.scrollTop =
    chatBox.scrollHeight;
}

/////////////////////////////////////////////////////
// SEND
/////////////////////////////////////////////////////
function send(){

  const input =
    document.getElementById(
      "message"
    );

  const message =
    input.value.trim();

  if(!message) return;

  /////////////////////////////////////////////////////
  // GROUP CHAT
  /////////////////////////////////////////////////////
  if(currentGroupId){

    socket.emit(
      "send_group_message",
      {
        group_id:
          currentGroupId,
        message
      }
    );

    input.value = "";

    return;
  }

  /////////////////////////////////////////////////////
  // PRIVATE CHAT
  /////////////////////////////////////////////////////
  if(!currentChatUser){

    alert(
      "Select user/group first"
    );

    return;
  }

  socket.emit(
    "send_message",
    {
      sender_id:
        myUserId,

      receiver_id:
        currentChatUser,

      message
    }
  );

  input.value = "";
}

/////////////////////////////////////////////////////
// ENTER KEY
/////////////////////////////////////////////////////
function handleEnter(e){

  if(e.key === "Enter"){
    send();
  }
}

/////////////////////////////////////////////////////
// TYPING EVENT
/////////////////////////////////////////////////////
function typingEvent(){

  if(
    !currentChatUser
  ) return;

  socket.emit(
    "typing",
    {
      sender_id:
        myUserId,

      receiver_id:
        currentChatUser
    }
  );

  clearTimeout(
    window.typingTimeout
  );

  window.typingTimeout =
    setTimeout(()=>{

      socket.emit(
        "stop_typing",
        {
          receiver_id:
            currentChatUser
        }
      );

    },1000);
}

/////////////////////////////////////////////////////
// SEARCH
/////////////////////////////////////////////////////
function searchUser(text){

  const filtered =
    usersCache.filter(u =>
      u.email
        .toLowerCase()
        .includes(
          text.toLowerCase()
        )
    );

  const list =
    document.getElementById(
      "chatList"
    );

  list.innerHTML = "";

  filtered.forEach(u => {

    const div =
      document.createElement(
        "div"
      );

    div.className = "user";

    div.innerHTML = `
      <div class="avatar">
        <div class="avatar-inner">
          ${u.email[0]
            .toUpperCase()}
        </div>
      </div>

      <div class="user-info">

        <div class="username">
          ${u.email}
        </div>

      </div>
    `;

    div.onclick =
      ()=> openChat(u);

    list.appendChild(div);
  });
}

/////////////////////////////////////////////////////
// INIT
/////////////////////////////////////////////////////
let token =
  localStorage.getItem(
    "token"
  );

if(!token){

  token = prompt(
    "Paste JWT Token"
  );

  localStorage.setItem(
    "token",
    token
  );
}

connect(token);

</script>

</body>
</html>
