<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CHAT PRO</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      overflow:hidden;
      background:#fafafa;
    }

    .sidebar{
      width:350px;
      background:white;
      border-right:1px solid #ddd;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      height:70px;
      padding:20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid #ddd;
      font-size:20px;
      font-weight:bold;
    }

    .search{
      padding:15px;
      border-bottom:1px solid #eee;
    }

    .search input{
      width:100%;
      padding:12px;
      border:none;
      outline:none;
      background:#efefef;
      border-radius:10px;
    }

    .chat-list{
      flex:1;
      overflow-y:auto;
    }

    .user{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px;
      cursor:pointer;
      border-bottom:1px solid #f5f5f5;
      transition:0.2s;
    }

    .user:hover{
      background:#fafafa;
    }

    .active{
      background:#f0f0f0;
    }

    .avatar{
      width:56px;
      height:56px;
      border-radius:50%;
      background:linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
      );

      padding:2px;

      display:flex;
      align-items:center;
      justify-content:center;

      flex-shrink:0;
    }

    .avatar-inner{
      width:100%;
      height:100%;
      border-radius:50%;
      background:white;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:20px;
      font-weight:bold;
    }

    .user-info{
      flex:1;
    }

    .username{
      font-size:14px;
      font-weight:bold;
    }

    .last-message{
      margin-top:3px;
      font-size:13px;
      color:gray;
    }

    .online-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#00c853;
    }

    .chat-container{
      flex:1;
      display:flex;
      flex-direction:column;
      background:white;
    }

    .chat-header{
      height:70px;
      padding:0 20px;
      display:flex;
      align-items:center;
      gap:12px;
      border-bottom:1px solid #ddd;
      background:white;
    }

    .chat-user{
      font-size:15px;
      font-weight:bold;
    }

    .typing{
      font-size:12px;
      color:gray;
    }

    #chatBox{
      flex:1;
      overflow-y:auto;
      padding:20px;
      display:flex;
      flex-direction:column;
      background:#fafafa;
    }

    .empty{
      margin:auto;
      color:gray;
      font-size:15px;
      text-align:center;
    }

    .loading{
      text-align:center;
      padding:20px;
      color:gray;
      font-size:13px;
    }

    .message{
      max-width:65%;
      padding:12px 15px;
      margin:5px 0;
      border-radius:22px;
      font-size:14px;
      line-height:1.4;
      word-wrap:break-word;
      position:relative;
    }

    .me{
      align-self:flex-end;
      background:#3797f0;
      color:white;
      border-bottom-right-radius:8px;
    }

    .friend{
      align-self:flex-start;
      background:#efefef;
      color:black;
      border-bottom-left-radius:8px;
    }

    .time{
      margin-top:5px;
      font-size:10px;
      opacity:0.7;
      text-align:right;
    }

    .delete-btn{
      margin-left:8px;
      cursor:pointer;
      color:red;
      font-size:12px;
    }

    .chat-input{
      padding:15px;
      border-top:1px solid #ddd;
      background:white;
    }

    .input-box{
      display:flex;
      align-items:center;
      border:1px solid #ddd;
      border-radius:30px;
      padding:10px 15px;
    }

    .input-box input{
      flex:1;
      border:none;
      outline:none;
      font-size:14px;
      background:transparent;
    }

    .send-btn{
      border:none;
      background:none;
      color:#3797f0;
      font-size:14px;
      font-weight:bold;
      cursor:pointer;
    }

    @media(max-width:768px){

      .sidebar{
        width:80px;
      }

      .username,
      .last-message{
        display:none;
      }

      .chat-user{
        font-size:13px;
      }
    }

    .media-btn{
  border:none;
  background:none;
  cursor:pointer;
  font-size:20px;
  margin-right:10px;
}

.chat-image{
  max-width:250px;
  border-radius:10px;
  display:block;
}

.chat-video{
  max-width:250px;
  border-radius:10px;
  display:block;
}
/* Upload Progress Container */
#uploadContainer{
  display:none;
  width:100%;
  padding:10px;
  margin-bottom:10px;
  background:#fff;
  border-radius:10px;
}

/* Progress Background */
.progress-wrapper{
  width:100%;
  height:20px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
}

/* Progress Bar */
#uploadBar{
  width:0%;
  height:100%;
  background:linear-gradient(
    90deg,
    #4CAF50,
    #66BB6A
  );
  transition:width .2s ease;
}

/* Percentage Text */
#uploadText{
  margin-top:8px;
  font-size:14px;
  font-weight:bold;
  color:#333;
}

/* Upload Speed */
#uploadSpeed{
  margin-top:4px;
  font-size:13px;
  color:#666;
}
  </style>
</head>

<body>

  <div class="sidebar">

    <div class="topbar">
      CHAT PRO
    </div>

    <div class="search">

      <input
        type="text"
        placeholder="Search"
        oninput="searchUser(this.value)"
      />

    </div>

    <div
      id="chatList"
      class="chat-list"
    ></div>

  </div>

  <div class="chat-container">

    <div class="chat-header">

      <div class="avatar">
        <div
          class="avatar-inner"
          id="headerAvatar"
        >
          U
        </div>
      </div>

      <div>

        <div
          class="chat-user"
          id="chatHeader"
        >
          Select a user
        </div>

        <div
          class="typing"
          id="typing"
        ></div>

      </div>

    </div>

    <div id="chatBox">

      <div class="empty">
        <h2>CHAT PRO</h2>
        <br>
        Select user or group to start chatting 🚀
      </div>

    </div>

    <div class="chat-input">

  <!-- Upload Progress -->
  <div
    id="uploadContainer"
    style="
      display:none;
      padding:10px;
      width:100%;
    "
  >

    <div
      style="
        width:100%;
        background:#ddd;
        border-radius:10px;
      "
    >
      <div
        id="uploadBar"
        style="
          width:0%;
          height:20px;
          background:#4CAF50;
          border-radius:10px;
          transition:0.2s;
        "
      ></div>
    </div>

    <div id="uploadText">
      0%
    </div>

    <div id="uploadSpeed">
      0 MB/s
    </div>

  </div>

  <div class="input-box">

    <input
      type="file"
      id="mediaFile"
      accept="image/*,video/*,.pdf,.doc,.docx"
      style="display:none"
      onchange="uploadMedia()"
    />

    <button
      class="media-btn"
      onclick="document.getElementById('mediaFile').click()"
    >
      📎
    </button>

    <input
      id="message"
      placeholder="Message..."
      onkeypress="handleEnter(event)"
      oninput="typingEvent()"
    />

    <button
      class="send-btn"
      onclick="send()"
    >
      Send
    </button>

  </div>

</div>

<!-- <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script> -->
<script src="http://localhost:3001/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>

let socket;
let myUserId;

let currentChatUser = null;
let currentGroupId = null;

let usersCache = [];
let groupsCache = [];

let onlineUsers = [];


/////////////////////////////////////////////////////
// MEDIA UPLOAD
/////////////////////////////////////////////////////
async function uploadMedia() {

  const file =
    document.getElementById("mediaFile")
    .files[0];

  if (!file) return;

  const formData =
    new FormData();

  formData.append(
    "media",
    file
  );

  const uploadContainer =
    document.getElementById(
      "uploadContainer"
    );

  const uploadBar =
    document.getElementById(
      "uploadBar"
    );

  const uploadText =
    document.getElementById(
      "uploadText"
    );

  const uploadSpeed =
    document.getElementById(
      "uploadSpeed"
    );

  uploadContainer.style.display =
    "block";

  uploadBar.style.width = "0%";

  uploadText.innerHTML =
    `Uploading ${file.name}<br>0%`;

  uploadSpeed.innerHTML =
    "0 MB/s";

  const startTime =
    Date.now();

  try {

    const response =
      await axios.post(
        "http://localhost:3001/api/chats/upload",
        formData,
        {
          headers: {
            Authorization:
              "Bearer " +
              localStorage.getItem(
                "token"
              )
          },
          onUploadProgress: (progressEvent) => {

  console.log(
    "PROGRESS EVENT =>",
    progressEvent
  );

  if (!progressEvent.total) {

    console.log(
      "TOTAL SIZE NOT AVAILABLE"
    );

    return;
  }

  const percent =
    Math.round(
      (
        progressEvent.loaded *
        100
      ) /
      progressEvent.total
    );

  console.log(
    "PERCENT =>",
    percent
  );

  uploadBar.style.width =
    percent + "%";

  const elapsed =
    Math.max(
      (
        Date.now() -
        startTime
      ) / 1000,
      0.1
    );

  const speed =
    progressEvent.loaded /
    elapsed;

  const uploadedMB =
    (
      progressEvent.loaded /
      1024 /
      1024
    ).toFixed(2);

  const totalMB =
    (
      progressEvent.total /
      1024 /
      1024
    ).toFixed(2);

  uploadText.innerHTML =
    `
    ${percent}% Uploaded
    <br>
    ${uploadedMB} MB /
    ${totalMB} MB
    `;

  uploadSpeed.innerHTML =
    `
    Speed:
    ${(
      speed /
      1024 /
      1024
    ).toFixed(2)}
    MB/s
    `;

  console.log(
    `UPLOADED => ${uploadedMB} MB`
  );

  console.log(
    `SPEED => ${
      (
        speed /
        1024 /
        1024
      ).toFixed(2)
    } MB/s`
  );
 }
 });              

    const data =
      response.data;

    uploadBar.style.width =
      "100%";

    uploadText.innerHTML =
      "✅ Upload Complete";

    uploadSpeed.innerHTML =
      "";

    setTimeout(() => {

      uploadContainer.style.display =
        "none";

    }, 1500);

    console.log(
      "UPLOAD RESPONSE:",
      data
    );

    if (!data.media_url) {

      alert(
        "Upload failed"
      );

      return;
    }

    if (currentGroupId) {

      socket.emit(
        "send_group_message",
        {
          group_id:
            currentGroupId,
          message: "",
          media_url:
            data.media_url,
          media_type:
            data.media_type
        }
      );

    } else {

      socket.emit(
        "send_message",
        {
          sender_id:
            myUserId,
          receiver_id:
            currentChatUser,
          message: "",
          media_url:
            data.media_url,
          media_type:
            data.media_type
        }
      );
    }

  } catch (err) {

    console.error(err);

    uploadText.innerHTML =
      "❌ Upload Failed";

    uploadSpeed.innerHTML =
      "";

    setTimeout(() => {

      uploadContainer.style.display =
        "none";

    }, 2000);
  }
}
/////////////////////////////////////////////////////
// CONNECT
/////////////////////////////////////////////////////

function connect(token){

  const decoded =
    JSON.parse(
      atob(token.split('.')[1])
    );

  myUserId = decoded.id;

  socket = io(
    "http://localhost:3001",
    {
      auth:{ token }
    }
  );

  socket.on(
    "connect",
    ()=>{

      console.log(
        "🟢 Connected"
      );

      document.getElementById(
        "typing"
      ).innerText =
        "🟢 Connected";

      setTimeout(()=>{

        document.getElementById(
          "typing"
        ).innerText = "";

      },2000);

      loadChatList();
      loadGroups();
    }
  );

  socket.on(
    "disconnect",
    ()=>{

      document.getElementById(
        "typing"
      ).innerText =
        "❌ Socket disconnected";

      console.log(
        "❌ Socket disconnected"
      );
    }
  );

  socket.on(
    "onlineUsers",
    users => {

      onlineUsers = users;

      loadChatList();
    }
  );

  socket.on(
    "receive_message",
    msg => {

      if(
        Number(msg.sender_id) ===
        Number(myUserId)
      ){
        return;
      }

      if(
        msg.sender_id ==
        currentChatUser ||

        msg.receiver_id ==
        currentChatUser
      ){
        renderMessage(msg);
      }

      socket.emit(
        "seen",
        {
          sender_id:
            msg.sender_id
        }
      );

      loadChatList();
    }
  );

  socket.on(
    "message_sent",
    msg => {

      renderMessage(msg);

      loadChatList();
    }
  );

  socket.on(
    "receive_group_message",
    msg => {

      console.log(
        "👥 GROUP MESSAGE:",
        msg
      );

      if(
        Number(msg.group_id) ===
        Number(currentGroupId)
      ){
        renderMessage(msg);
      }
    }
  );

  socket.on(
    "typing",
    ()=>{

      document.getElementById(
        "typing"
      ).innerText =
        "Typing...";
    }
  );

  socket.on(
    "stop_typing",
    ()=>{

      document.getElementById(
        "typing"
      ).innerText = "";
    }
  );
}

/////////////////////////////////////////////////////
// LOAD CHAT LIST
/////////////////////////////////////////////////////

async function loadChatList(){

  const res = await fetch(
    "http://localhost:3001/api/chats/list",
    {
      headers:{
        Authorization:
          "Bearer " +
          localStorage.getItem(
            "token"
          )
      }
    }
  );

  const data =
    await res.json();

  usersCache =
    data.users || [];

  const list =
    document.getElementById(
      "chatList"
    );

  list.innerHTML = "";

  usersCache.forEach(u => {

    const online =
      onlineUsers.includes(
        String(u.user_id)
      );

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "user " +
      (
        currentChatUser ==
        u.user_id
        ? "active"
        : ""
      );

    div.onclick =
      ()=> openChat(u);

    div.innerHTML = `
      <div class="avatar">
        <div class="avatar-inner">
          ${u.email[0].toUpperCase()}
        </div>
      </div>

      <div class="user-info">

        <div class="username">
          ${u.email}
        </div>

        <div class="last-message">
          ${
            u.last_message ||
            "Active now"
          }
        </div>

      </div>

      ${
        online
        ? `<div class="online-dot"></div>`
        : ""
      }
    `;

    list.appendChild(div);
  });

  const title =
    document.createElement("div");

  title.style.padding = "12px";
  title.style.fontWeight = "bold";
  title.innerText = "👥 Groups";

  list.appendChild(title);

  groupsCache.forEach(group => {

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "user " +
      (
        currentGroupId ==
        group.id
        ? "active"
        : ""
      );

    div.onclick =
      ()=> openGroup(group);

    div.innerHTML = `
      <div class="avatar">
        <div class="avatar-inner">
          👥
        </div>
      </div>

      <div class="user-info">

        <div class="username">
          ${group.name}
        </div>

        <div class="last-message">
          Group Chat
        </div>

      </div>
    `;

    list.appendChild(div);
  });
}

/////////////////////////////////////////////////////
// LOAD GROUPS
/////////////////////////////////////////////////////

async function loadGroups(){

  try {

    const res = await fetch(
      "http://localhost:3001/api/chats/groups",
      {
        headers:{
          Authorization:
            "Bearer " +
            localStorage.getItem(
              "token"
            )
        }
      }
    );

    const data =
      await res.json();

    groupsCache =
      data.groups || [];

    loadChatList();

  } catch(err){

    console.log(
      "❌ GROUP LOAD ERROR:",
      err.message
    );
  }
}

/////////////////////////////////////////////////////
// OPEN PRIVATE CHAT
/////////////////////////////////////////////////////

async function openChat(user){

  currentGroupId = null;

  currentChatUser =
    user.user_id;

  document.getElementById(
    "chatHeader"
  ).innerText =
    user.email;

  document.getElementById(
    "headerAvatar"
  ).innerText =
    user.email[0]
      .toUpperCase();

  const chatBox =
    document.getElementById(
      "chatBox"
    );

  chatBox.innerHTML = `
    <div class="loading">
      Loading messages...
    </div>
  `;

  const res = await fetch(
    `http://localhost:3001/api/chats/conversation/${user.user_id}`,
    {
      headers:{
        Authorization:
          "Bearer " +
          localStorage.getItem(
            "token"
          )
      }
    }
  );

  const data =
    await res.json();

  chatBox.innerHTML = "";

  (
    data.messages || []
  ).forEach(
    renderMessage
  );
}

/////////////////////////////////////////////////////
// OPEN GROUP
/////////////////////////////////////////////////////

async function openGroup(group){

  currentChatUser = null;

  currentGroupId =
    group.id;

  socket.emit(
    "join_group",
    group.id
  );

  document.getElementById(
    "chatHeader"
  ).innerText =
    group.name;

  document.getElementById(
    "headerAvatar"
  ).innerText = "👥";

  const chatBox =
    document.getElementById(
      "chatBox"
    );

  chatBox.innerHTML = `
    <div class="loading">
      Loading group messages...
    </div>
  `;

  try {

    const res = await fetch(
      `http://localhost:3001/api/chats/groups/${group.id}/messages`,
      {
        headers:{
          Authorization:
            "Bearer " +
            localStorage.getItem(
              "token"
            )
        }
      }
    );

    const data =
      await res.json();

    chatBox.innerHTML = "";

    const messages =
      data.messages ||
      data.data ||
      [];

    messages.forEach(
      renderMessage
    );

  } catch(err){

    console.log(
      "❌ GROUP ERROR:",
      err.message
    );
  }
}

/////////////////////////////////////////////////////
// DELETE MESSAGE
/////////////////////////////////////////////////////

async function deleteMessage(messageId){

  const confirmDelete =
    confirm(
      "Delete this message?"
    );

  if(!confirmDelete) return;

  try{

    const res = await fetch(
      `http://localhost:3001/api/chats/${messageId}`,
      {
        method:"DELETE",

        headers:{
          Authorization:
            "Bearer " +
            localStorage.getItem(
              "token"
            )
        }
      }
    );

    const data =
      await res.json();

    if(data.success){

      const msgEl =
        document.getElementById(
          "msg_" + messageId
        );

      if(msgEl){
        msgEl.remove();
      }

      console.log(
        "✅ Message deleted"
      );

    }else{

      alert(
        data.message ||
        "Delete failed"
      );
    }

  }catch(err){

    console.log(
      "❌ DELETE ERROR:",
      err.message
    );

    alert(
      "Delete failed"
    );
  }
}

/////////////////////////////////////////////////////
// RENDER MESSAGE
/////////////////////////////////////////////////////
function renderMessage(msg){

  const chatBox = document.getElementById("chatBox");

  const empty = document.querySelector(".empty");

  if(empty){
    empty.remove();
  }

  const div = document.createElement("div");

  div.id = "msg_" + msg.id;

  div.className =
    "message " +
    (
      Number(msg.sender_id) === Number(myUserId)
      ? "me"
      : "friend"
    );

  const time = new Date(
    msg.created_at || Date.now()
  ).toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });

  const deleteBtn =
    Number(msg.sender_id) === Number(myUserId)
    ? `
      <span
        class="delete-btn"
        onclick="deleteMessage(${msg.id})"
      >
        🗑️
      </span>
    `
    : "";

  /////////////////////////////////////////////////////
  // MEDIA CONTENT
  /////////////////////////////////////////////////////

  let content = msg.message || "";

  if(msg.media_url){

    if(
      msg.media_type &&
      msg.media_type.startsWith("image/")
    ){

      content = `
        <img
          src="http://localhost:3001${msg.media_url}"
          class="chat-image"
        />
      `;

    }else if(
      msg.media_type &&
      msg.media_type.startsWith("video/")
    ){

      content = `
        <video
          controls
          class="chat-video"
        >
          <source
            src="http://localhost:3001${msg.media_url}"
            type="${msg.media_type}"
          >
        </video>
      `;

    }else{

      content = `
        <a
          href="http://localhost:3001${msg.media_url}"
          target="_blank"
        >
          📄 Download File
        </a>
      `;
    }
  }

  /////////////////////////////////////////////////////
  // HTML
  /////////////////////////////////////////////////////

  div.innerHTML = `
    <div>

      ${
        currentGroupId &&
        msg.sender_name
        ? `
          <div style="
            font-size:12px;
            font-weight:bold;
            margin-bottom:5px;
          ">
            ${msg.sender_name}
          </div>
        `
        : ""
      }

      ${content}

    </div>

    <div class="time">

      ${time}

      ${
        Number(msg.sender_id) ===
        Number(myUserId)
        ? " ✔✔"
        : ""
      }

      ${deleteBtn}

    </div>
  `;

  chatBox.appendChild(div);

  chatBox.scrollTo({
    top: chatBox.scrollHeight,
    behavior: "smooth"

/////////////////////////////////////////////////////
// SEND MESSAGE
/////////////////////////////////////////////////////

function send(){

  const input =
    document.getElementById(
      "message"
    );

  const message =
    input.value.trim();

  if(!message) return;

  if(currentGroupId){

    socket.emit(
      "send_group_message",
      {
        group_id:
          currentGroupId,

        message
      }
    );

    input.value = "";

    return;
  }

  if(!currentChatUser){

    alert(
      "Select user/group first"
    );

    return;
  }

  socket.emit(
    "send_message",
    {
      sender_id:
        myUserId,

      receiver_id:
        currentChatUser,

      message
    }
  );

  input.value = "";
}

/////////////////////////////////////////////////////
// ENTER KEY
/////////////////////////////////////////////////////

function handleEnter(e){

  if(e.key === "Enter"){
    send();
  }
}

/////////////////////////////////////////////////////
// TYPING
/////////////////////////////////////////////////////

function typingEvent(){

  if(
    !currentChatUser
  ) return;

  socket.emit(
    "typing",
    {
      sender_id:
        myUserId,

      receiver_id:
        currentChatUser
    }
  );

  clearTimeout(
    window.typingTimeout
  );

  window.typingTimeout =
    setTimeout(()=>{

      socket.emit(
        "stop_typing",
        {
          receiver_id:
            currentChatUser
        }
      );

    },1000);
}

/////////////////////////////////////////////////////
// SEARCH
/////////////////////////////////////////////////////

function searchUser(text){

  const filtered =
    usersCache.filter(u =>
      u.email
        .toLowerCase()
        .includes(
          text.toLowerCase()
        )
    );

  const list =
    document.getElementById(
      "chatList"
    );

  list.innerHTML = "";

  filtered.forEach(u => {

    const div =
      document.createElement(
        "div"
      );

    div.className = "user";

    div.onclick =
      ()=> openChat(u);

    div.innerHTML = `
      <div class="avatar">
        <div class="avatar-inner">
          ${u.email[0].toUpperCase()}
        </div>
      </div>

      <div class="user-info">

        <div class="username">
          ${u.email}
        </div>

      </div>
    `;

    list.appendChild(div);
  });
}
